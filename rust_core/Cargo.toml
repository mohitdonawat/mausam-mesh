[package]
name = "mausam-mesh-core"
version = "1.0.0"
edition = "2021"
authors = ["Mohit Donawat <mohitdonawat24@gmail.com>"]
description = "High-Performance Rust Numerical Core for MausamMesh: SIMD Quantization & O(1) Spatial Slicing"
license = "MIT"

[lib]
name = "mausam_mesh_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = []
python-extension = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
